<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delivery Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F2;--surface:#FFFFFF;--sunk:#EAEEE9;--ink:#17201C;--muted:#59645E;--faint:#8A948E;--line:#D5DBD5;
  --accent:#21483D;--accent-ink:#FFFFFF;--accent-soft:#DCE8E2;
  --red:#B42318;--red-bg:#FCEBE9;--amber:#93460A;--amber-bg:#FDF1DF;--green:#1B6A36;--green-bg:#E5F3EA;--neutral-bg:#ECEFEC;
  --focus:#2463EB;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111614;--surface:#181E1B;--sunk:#212925;--ink:#E5EBE7;--muted:#A0ABA5;--faint:#738079;--line:#2E3833;
    --accent:#8FCBAA;--accent-ink:#0E1A14;--accent-soft:#1F3229;
    --red:#F2948B;--red-bg:#3A1E1B;--amber:#F0B46D;--amber-bg:#372715;--green:#82D29F;--green-bg:#163021;--neutral-bg:#232B27;
    --focus:#7AA7FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614;--surface:#181E1B;--sunk:#212925;--ink:#E5EBE7;--muted:#A0ABA5;--faint:#738079;--line:#2E3833;
  --accent:#8FCBAA;--accent-ink:#0E1A14;--accent-soft:#1F3229;
  --red:#F2948B;--red-bg:#3A1E1B;--amber:#F0B46D;--amber-bg:#372715;--green:#82D29F;--green-bg:#163021;--neutral-bg:#232B27;
  --focus:#7AA7FF;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 28px}
.brand{display:flex;flex-direction:column;padding-bottom:12px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav.tabs a{padding:10px 12px 11px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
nav.tabs a:hover{color:var(--ink)}
.whoami{padding-bottom:12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.on{background:var(--green)}

main{max-width:1320px;margin:0 auto;padding:22px 20px 60px}
.banner{border:1px solid var(--line);background:var(--surface);padding:12px 14px;border-radius:6px;margin-bottom:18px;color:var(--muted)}
.banner.warn{border-color:var(--amber);background:var(--amber-bg);color:var(--ink)}
h1{font-size:28px;line-height:1.15;margin:0 0 4px;font-weight:700;letter-spacing:-.02em}
h2{font-size:17px;margin:0;font-weight:600;letter-spacing:-.005em}
.sub{color:var(--muted);margin:0 0 20px}
.section{margin-top:30px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;border-bottom:1px solid var(--ink);padding-bottom:6px}
.section-h .count{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Today layout */
.today-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.today-grid{grid-template-columns:minmax(0,1fr)}}
.numbers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.num{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.numbers .num:nth-child(odd){border-right:1px solid var(--line);padding-right:12px}
.numbers .num:nth-child(even){padding-left:12px}
.num:hover .num-l{color:var(--ink)}
.num-l{color:var(--muted);font-size:14px}
.num-v{font-size:26px;font-weight:600;letter-spacing:-.02em}
.num.red .num-v{color:var(--red)}
.num.amber .num-v{color:var(--amber)}
.num.green .num-v{color:var(--green)}

/* Needs-you list */
.needs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.needs li{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.needs li:hover{background:var(--sunk)}
.needs .bar{border-radius:2px;background:var(--amber)}
.needs li.sev-red .bar{background:var(--red)}
.needs .t{font-weight:600}
.needs .why{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.needs .meta{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.empty{padding:18px 0;color:var(--muted);border-bottom:1px solid var(--line)}

/* Pills */
.pill{display:inline-flex;align-items:center;font-size:12.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--neutral-bg);color:var(--ink);white-space:nowrap;line-height:1.6}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pri{font-weight:700;font-size:12.5px}
.pri.P0{color:var(--red)}.pri.P1{color:var(--amber)}.pri.P2{color:var(--ink)}.pri.P3{color:var(--muted)}

/* Slip rows */
.slips{border-top:1px solid var(--line)}
.slip{display:grid;grid-template-columns:minmax(180px,1.3fr) 110px minmax(200px,1.4fr) 70px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.slip:hover{background:var(--sunk)}
.slip .who{font-size:13px;color:var(--muted)}
.track{position:relative;height:22px}
.track .base{position:absolute;top:10px;left:0;right:0;height:2px;background:var(--line)}
.track .late{position:absolute;top:8px;height:6px;background:var(--red);border-radius:3px;opacity:.85}
.track .mk{position:absolute;top:2px;width:2px;height:18px;background:var(--ink)}
.track .lab{position:absolute;top:-1px;font-size:11.5px;color:var(--muted);transform:translateX(4px);white-space:nowrap}
.delay{font-weight:700;color:var(--red);text-align:right}
@media (max-width:720px){.slip{grid-template-columns:1fr 70px}.slip .track,.slip .slip-dates{display:none}}

/* Tables */
.tw{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--bg);position:sticky;top:0;z-index:1;white-space:nowrap}
th.sortable{cursor:pointer}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
td.n{text-align:right}
td.id{color:var(--muted);white-space:nowrap}
td .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:360px}
.tasks-scroll{max-height:calc(100vh - 260px);overflow:auto}

.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media (max-width:900px){.cols3,.cols2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.top-in{padding:10px 14px 0;gap:4px 12px}.brand{padding-bottom:4px}.whoami{padding-bottom:4px;margin-left:auto}nav.tabs{order:3;flex-basis:100%}nav.tabs a{padding:8px 10px 9px}main{padding:16px 14px 48px}h1{font-size:24px}}
.comp{border-top:1px solid var(--line)}
.comp-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.comp-row:hover{background:var(--sunk)}
.comp-row .miss{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.bars{border-top:1px solid var(--line)}
.brow{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.brow .b{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.brow .b i{display:block;height:100%;background:var(--accent)}
.brow .v{text-align:right;font-weight:600}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input[type=search]{min-width:220px;flex:1}
.ctl,select,input[type=text],input[type=search],input[type=date],input[type=number],input[type=url],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px}
textarea{width:100%;min-height:64px;resize:vertical}
select{padding-right:26px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;min-height:36px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--muted);text-decoration:underline}
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* Forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.form .full{grid-column:1/-1}
@media (max-width:700px){.form{grid-template-columns:minmax(0,1fr)}}
.f{min-width:0}.f select{min-width:0;max-width:100%}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.f label .req{color:var(--red);font-weight:600}
.f .hint{font-size:12.5px;color:var(--muted);margin-top:3px}
.f input,.f select,.f textarea{width:100%}
.f input[readonly],.f select:disabled,.f input:disabled{background:var(--sunk);color:var(--muted)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--red)}
.f .errmsg{color:var(--red);font-size:12.5px;margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{margin:0;padding:7px 14px;cursor:pointer;font-weight:500;font-size:14px;border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg label{position:relative}
.seg input{position:absolute;inset:0;opacity:0;pointer-events:none;margin:0}
.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.group-h{grid-column:1/-1;font-weight:600;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.update-wrap{max-width:860px}
.computed{display:flex;gap:18px;flex-wrap:wrap;padding:10px 12px;background:var(--sunk);border-radius:6px;font-size:14px}

/* Dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:min(920px,100vw);max-width:100vw;height:100%;max-height:100vh;margin:0 0 0 auto;box-shadow:-18px 0 40px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(10,16,13,.35)}
.dlg{display:flex;flex-direction:column;height:100%}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);gap:12px}
.dlg-b{flex:1;overflow:auto;padding:18px 22px 30px}
.dlg-f{display:flex;justify-content:space-between;gap:10px;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--line)}
.timeline li{padding:0 0 14px 14px;position:relative}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.timeline li.eta::before{border-color:var(--amber)}
.timeline li.blk::before{border-color:var(--red)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:50;max-width:90vw}
.guide{max-width:760px}
.guide p,.guide li{line-height:1.6}
dl.defs{display:grid;grid-template-columns:140px 1fr;gap:6px 16px;margin:0}
dl.defs dt{font-weight:600}
dl.defs dd{margin:0;color:var(--muted)}
.check{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.check li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.chip-list{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--neutral-bg);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 6px;font-size:16px;line-height:1}
.addrow{display:flex;gap:8px}
.f .checks{display:flex;flex-wrap:wrap;gap:6px}
.f .checks label{display:inline-flex;align-items:center;gap:6px;margin:0;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-weight:500;font-size:14px;cursor:pointer;background:var(--surface)}
.f .checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.f .checks label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:1px}
.ai-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
#pasteBox summary{cursor:pointer;color:var(--muted);font-size:13.5px}
textarea.ai-new{border-color:var(--accent);background:var(--accent-soft)}
.prd-files{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.prd-files li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prd-files .fname{font-weight:500;flex:1;min-width:160px;word-break:break-word}
.prd-preview{width:100%;height:520px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
pre.prd-text{white-space:pre-wrap;word-break:break-word;max-height:520px;overflow:auto;background:var(--sunk);padding:12px;border-radius:6px;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0;width:100%}
.hidden{display:none!important}
.loading{color:var(--muted);padding:30px 0}
/* v2 additions */
.spacepick{padding-bottom:10px}
.spacepick select{min-height:34px;font-weight:600;max-width:240px}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk)}
.role-tag{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card h3{margin:0;font-size:16px}
.card .stats{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.card .stats b{color:var(--ink)}
.since{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-8px 0 18px}
.people{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.people li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.people li .grow{flex:1;min-width:140px}
.picker{position:relative;max-width:420px}
.picker-res{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);margin-top:4px;list-style:none;padding:4px;max-height:280px;overflow:auto}
.picker-res li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer}
.picker-res li:hover,.picker-res li[aria-selected="true"]{background:var(--sunk)}
.thread{list-style:none;margin:0;padding:0}
.thread li{padding:10px 0;border-bottom:1px solid var(--line)}
.thread .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.thread .body{white-space:pre-wrap;margin-top:3px}
.ro-note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 10px}
dialog.mini{width:min(560px,94vw);height:auto;max-height:90vh;margin:auto;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
dialog.mini .mini-in{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.rel-row{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px;align-items:center}
.rel-row input{min-width:0;width:100%}.addrow input{min-width:0;flex:1}
@media (max-width:520px){.rel-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rel-row>:first-child{grid-column:1/-1}}
.avatar.off{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);border:1px dashed var(--muted);background:none}
.tag-wait{background:var(--amber-bg);color:var(--amber)}
@media (max-width:720px){.spacepick{order:2;flex-basis:100%;padding-bottom:4px}.spacepick select{max-width:100%;width:100%}}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ===== Premium theme (overrides) ===== */
:root{
  --bg:#F4F6F4;--surface:#FFFFFF;--sunk:#EEF2EF;--ink:#14211C;--muted:#5C6A64;--faint:#8D9993;--line:#E2E7E3;--line-strong:#CDD5D0;
  --accent:#1D5C47;--accent-ink:#FFFFFF;--accent-soft:#E3EFE9;--brass:#B38A4A;
  --rail:#13211C;--rail-ink:#EEF3F0;--rail-muted:#9FB0A8;--rail-line:#24352E;
  --red:#B42318;--red-bg:#FDEEEC;--amber:#9A5B06;--amber-bg:#FCF2E1;--green:#1C7246;--green-bg:#E6F4EC;--neutral-bg:#EEF1EF;
  --focus:#1D5C47;--radius:14px;--radius-s:10px;
  --shadow:0 1px 0 rgba(20,33,28,.04),0 1px 2px rgba(20,33,28,.05),0 8px 24px -12px rgba(20,33,28,.10);
  --serif:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:"Montserrat",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613;--surface:#161F1B;--sunk:#1D2823;--ink:#E7EEEA;--muted:#9CABA4;--faint:#6F7E77;--line:#25312C;--line-strong:#33423B;
  --accent:#7FC9A6;--accent-ink:#0C1712;--accent-soft:#1B2E26;--brass:#D2AE6E;
  --rail:#0B120F;--rail-ink:#E7EEEA;--rail-muted:#8A9A93;--rail-line:#1D2924;
  --red:#F2958C;--red-bg:#36201D;--amber:#EDB66E;--amber-bg:#33281A;--green:#86D3A8;--green-bg:#17301F;--neutral-bg:#212C27;
  --focus:#7FC9A6;--shadow:0 1px 0 rgba(0,0,0,.25),0 8px 24px -12px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  --bg:#0F1613;--surface:#161F1B;--sunk:#1D2823;--ink:#E7EEEA;--muted:#9CABA4;--faint:#6F7E77;--line:#25312C;--line-strong:#33423B;
  --accent:#7FC9A6;--accent-ink:#0C1712;--accent-soft:#1B2E26;--brass:#D2AE6E;
  --rail:#0B120F;--rail-ink:#E7EEEA;--rail-muted:#8A9A93;--rail-line:#1D2924;
  --red:#F2958C;--red-bg:#36201D;--amber:#EDB66E;--amber-bg:#33281A;--green:#86D3A8;--green-bg:#17301F;--neutral-bg:#212C27;
  --focus:#7FC9A6;--shadow:0 1px 0 rgba(0,0,0,.25),0 8px 24px -12px rgba(0,0,0,.5);}
body{font-family:var(--sans);font-size:14.5px;line-height:1.55;letter-spacing:.003em}
body::before{background:var(--rail)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* Header rail */
.top{background:var(--rail);border-bottom:1px solid var(--rail-line);color:var(--rail-ink)}
.top-in{padding:14px 28px 0;max-width:1360px;gap:8px 32px;align-items:center}
.brand{padding-bottom:14px}
.brand b{font-family:var(--serif);font-weight:400;font-size:25px;letter-spacing:-.005em;line-height:1}
.brand span{color:var(--rail-muted);font-size:12.5px;margin-top:3px}
.spacepick{padding-bottom:14px}
.spacepick select{background:rgba(255,255,255,.06);color:var(--rail-ink);border:1px solid var(--rail-line);border-radius:999px;padding:6px 32px 6px 14px;min-height:34px;font-weight:600;color-scheme:dark}
nav.tabs{align-self:flex-end;gap:4px}
nav.tabs a{color:var(--rail-muted);padding:10px 12px 13px;font-weight:500;border-bottom:2px solid transparent;transition:color .15s}
nav.tabs a:hover{color:var(--rail-ink)}
nav.tabs a[aria-current="page"]{color:var(--rail-ink);border-bottom-color:var(--brass)}
.whoami{padding-bottom:14px;color:var(--rail-muted)}
.whoami .who span:not(.role-tag){color:var(--rail-ink);font-weight:500}
.role-tag{text-transform:none;letter-spacing:0;font-size:12px;font-weight:500;color:var(--brass);border:1px solid rgba(179,138,74,.45);border-radius:999px;padding:1px 9px}
.dot.on{background:#5CC28C;box-shadow:0 0 0 3px rgba(92,194,140,.18)}

/* Page */
main{max-width:1360px;padding:34px 28px 72px}
h1{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.05;letter-spacing:-.015em;margin:0 0 8px}
h2{font-size:15px;font-weight:600;letter-spacing:0}
.sub{color:var(--muted);font-size:15px;margin:0 0 24px;max-width:72ch}
.toolbar{margin-bottom:22px;align-items:flex-end}
.loading{padding:60px 0;color:var(--muted)}

/* Panels: primary blocks sit on raised surfaces */
main .section,main .today-grid>section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px;margin-top:20px}
main .today-grid>section{margin-top:0}
main .guide .section{background:transparent;border:0;box-shadow:none;padding:0;margin-top:26px}
main .cols2,main .cols3{gap:20px}
main .cols2>.section,main .cols3>.section{margin-top:20px}
main .cols2>div>.section:first-child{margin-top:0}
.section-h{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
.section-h .count{font-size:12.5px;color:var(--faint)}
.today-grid{gap:20px}

/* Numbers */
.numbers{border-top:0;gap:0}
.num{padding:14px 4px;border-bottom:1px solid var(--line)}
.numbers .num:nth-child(odd){border-right:1px solid var(--line)}
.numbers .num:nth-last-child(-n+2){border-bottom:0}
.num-l{font-size:13px}
.num-v{font-size:30px;font-weight:600;letter-spacing:-.02em;font-feature-settings:"tnum"}
.num:hover{background:transparent}
.num:hover .num-l{color:var(--ink)}
main>.numbers{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:4px 18px}

/* Lists */
.needs{border-top:0}
.needs li{border-bottom:1px solid var(--line);padding:13px 6px;border-radius:8px}
.needs li:last-child{border-bottom:0}
.needs li:hover{background:var(--sunk)}
.needs .bar{border-radius:3px}
.needs .t{font-weight:600;font-size:15px}
.slips{border-top:0}
.slip{border-bottom:1px solid var(--line);padding:12px 6px;border-radius:8px}
.slip:last-child{border-bottom:0}
.slip:hover{background:var(--sunk)}
.track .late{background:linear-gradient(90deg,var(--amber),var(--red));opacity:1}
.empty{border-bottom:0;padding:16px 2px;color:var(--faint)}
.comp{border-top:0}
.comp-row{border-bottom:1px solid var(--line);padding:9px 2px}
.comp-row:last-child{border-bottom:0}
.bars{border-top:0}
.brow{border-bottom:1px solid var(--line);padding:8px 0}
.brow:last-child{border-bottom:0}
.brow .b{height:6px;background:var(--sunk)}
.brow .b i{background:var(--accent);border-radius:3px}

/* Pills */
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--neutral-bg);box-shadow:inset 0 0 0 1px rgba(20,33,28,.06)}
.pill.red{box-shadow:inset 0 0 0 1px rgba(180,35,24,.15)}
.pill.amber{box-shadow:inset 0 0 0 1px rgba(154,91,6,.15)}
.pill.green{box-shadow:inset 0 0 0 1px rgba(28,114,70,.15)}
.pri{font-size:12px;letter-spacing:.01em}

/* Tables */
.tw{border-top:0;border-radius:var(--radius-s)}
th{background:var(--surface);color:var(--faint);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line-strong);padding:10px 12px}
td{padding:11px 12px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr.click:hover{background:var(--sunk)}
td.id{font-feature-settings:"tnum";color:var(--faint)}
.tasks-scroll{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
main>.tw{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* Controls */
.ctl,select,input[type=text],input[type=search],input[type=date],input[type=number],input[type=url],textarea{border:1px solid var(--line-strong);border-radius:var(--radius-s);padding:8px 11px;min-height:38px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters{gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);margin-bottom:16px}
.filters input[type=search]{border-color:transparent;background:var(--sunk)}
.btn{border-radius:var(--radius-s);border:1px solid var(--line-strong);background:var(--surface);padding:8px 16px;min-height:38px;font-weight:600;font-size:14px;box-shadow:0 1px 0 rgba(20,33,28,.04);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted);background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 0 rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{filter:none;background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:var(--red-bg);border-color:rgba(180,35,24,.35)}
.btn.link{box-shadow:none;font-weight:500}
.seg{border:1px solid var(--line-strong);border-radius:var(--radius-s);padding:3px;gap:3px;background:var(--sunk)}
.seg label{border:0;border-radius:7px;padding:6px 14px}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,33,28,.12)}
.f label{font-size:13px;font-weight:600;margin-bottom:6px}
.f .hint{color:var(--faint)}
.f .checks label{border-radius:999px;padding:6px 12px;border-color:var(--line-strong)}
.f .checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.group-h{font-family:var(--serif);font-weight:400;font-size:22px;border-top:1px solid var(--line);padding-top:18px;margin-top:14px}
.computed{background:var(--sunk);border-radius:var(--radius-s);padding:12px 14px}
.banner{border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);padding:14px 16px}
.banner.warn{background:var(--amber-bg);border-color:rgba(154,91,6,.25)}
.ro-note{border-radius:var(--radius-s)}

/* Cards (spaces) */
.cards{gap:16px}
.card{border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px;gap:8px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card h3{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1}
.people{border-top:0}
.people li{border-bottom:1px solid var(--line);padding:10px 2px}
.people li:last-child{border-bottom:0}
.chip{background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)}
.check{border-top:0}

/* Dialogs */
dialog{border-radius:18px 0 0 18px;box-shadow:-30px 0 60px -20px rgba(10,20,15,.35)}
dialog::backdrop{background:rgba(12,22,18,.42);backdrop-filter:blur(2px)}
.dlg-h{padding:20px 26px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.dlg-b{padding:20px 26px 34px}
.dlg-f{padding:14px 26px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
dialog.mini{border-radius:18px;box-shadow:0 30px 70px -20px rgba(10,20,15,.45)}
dialog.mini h2{font-family:var(--serif);font-weight:400;font-size:26px}
.picker-res{border-radius:var(--radius-s);box-shadow:0 18px 40px -16px rgba(10,20,15,.35)}
.toast{border-radius:999px;padding:10px 18px;box-shadow:0 14px 30px -12px rgba(10,20,15,.5)}

/* Mobile */
@media (max-width:720px){
  .top-in{padding:10px 16px 0;gap:6px 12px}
  .brand b{font-size:22px}
  .spacepick select{width:100%}
  main{padding:22px 16px 56px}
  h1{font-size:34px}
  main .section,main .today-grid>section{padding:14px 14px 12px;border-radius:12px}
  .filters{padding:8px}
  dialog{border-radius:0}
}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}}
.f .checks input{width:auto;min-height:0;margin:0}
.f .checks label{white-space:nowrap}
/* Montserrat tuning: it sets wider and darker than the previous faces */
body{font-size:14px;letter-spacing:0}
h1{font-weight:700;font-size:36px;letter-spacing:-.025em;line-height:1.1}
.brand b{font-weight:700;font-size:19px;letter-spacing:-.01em}
.group-h{font-weight:600;font-size:17px;letter-spacing:-.01em}
.dlg-h h2,dialog.mini h2{font-weight:700;font-size:22px;letter-spacing:-.02em}
.card h3{font-weight:700;font-size:18px;letter-spacing:-.01em}
h2{font-size:14.5px;font-weight:700;letter-spacing:-.005em}
.num-v{font-size:28px;font-weight:700;letter-spacing:-.03em}
th{font-size:12px}
.btn{font-size:13.5px}
@media (max-width:720px){h1{font-size:28px}.brand b{font-size:17px}}
nav.tabs a{padding:10px 10px 13px}
nav.tabs{scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
.auth-wrap{max-width:440px;margin:6vh auto 0}
.auth-form{grid-template-columns:minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
.signout{background:none;border:1px solid var(--rail-line);color:var(--rail-muted);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;margin-bottom:14px}
.signout:hover{color:var(--rail-ink);border-color:var(--rail-muted)}
@media (max-width:720px){.signout{margin-bottom:4px}}

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Delivery Desk</b><span>Pluckk tech delivery</span></div>
    <div class="spacepick" id="spacePick"></div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="whoami" id="whoami"><span class="dot" id="conn"></span><span id="connText">Connecting…</span></div>
  </div>
</header>
<main id="main"><div class="loading">Loading…</div></main>
<dialog id="taskDlg" aria-labelledby="dlgTitle"><form class="dlg" id="taskForm" method="dialog" novalidate></form></dialog>
<dialog id="miniDlg" class="mini" aria-label="Dialog"><div id="miniBody"></div></dialog>
<dialog id="askDlg" class="mini" aria-labelledby="askMsg"><div class="mini-in"><p id="askMsg" style="margin:0;font-size:15px;line-height:1.5"></p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" type="button" id="askNo">Cancel</button><button class="btn primary" type="button" id="askYes">OK</button></div></div></dialog>
<div id="toastHost"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/dd-cloud.js"></script>
<script>
"use strict";
/* ============ Constants ============ */
const STATUSES=["Backlog","Ready","In Progress","Code Review","QA","Rework","Blocked","Done","Dropped"];
const CLOSED=new Set(["Done","Dropped"]);
const NOT_ACTIVE=new Set(["Backlog","Done","Dropped"]);
const NEEDS_UPDATE=new Set(["In Progress","Code Review","QA","Rework","Blocked"]);
const PRIORITIES=["P0","P1","P2","P3"];
const HEALTH=["Overdue","Blocked","Due Soon","On Track","No ETA","Closed"];
const CONFIDENCE=["High","Medium","Low"];
const DEFAULT_TYPES=["Feature","Bug","Tech Debt","Experiment","Support"];
const HEALTH_CLASS={"Overdue":"red","Blocked":"red","Due Soon":"amber","On Track":"green","No ETA":"","Closed":"green"};
const STATUS_DEF={
  "Backlog":"Captured but not ready. Scope, priority or developers still open. Not counted as active or overdue.",
  "Ready":"Scope, acceptance criteria, developers and Original ETA agreed. Can start any time.",
  "In Progress":"A developer is building it.",
  "Code Review":"Pull request is open and waiting for or under review.",
  "QA":"Build is with QA for testing against the acceptance criteria.",
  "Rework":"Review or QA found issues. Goes back to Code Review or QA once fixed. Each entry is counted.",
  "Blocked":"Work cannot continue because of a dependency or decision. Blocker details are required.",
  "Done":"Acceptance criteria met and QA passed. Completion date is recorded automatically.",
  "Dropped":"Intentionally cancelled. Excluded from every open, overdue and blocked count."
};
const ROLE_LABEL={admin:"Admin",pm:"PM",member:"Team",business:"Business viewer"};
const SPACE_ROLE_LABEL={pm:"PM",dev:"Developer",qa:"QA",both:"Developer + QA",viewer:"Viewer",none:"Not a member"};
const TRACKED_FIELDS={name:"Name",type:"Type",priority:"Priority",release:"Release",owners:"Developers",reviewers:"Reviewers",scope:"Scope",acceptance:"Acceptance criteria",prdLink:"PRD link",originalEta:"Original ETA",dependsOn:"Depends on",notes:"Notes",pct:"% complete",remaining:"Remaining effort",pr:"PR link",blockerDetails:"Blocker details",blockerOwner:"Blocker owner",pmSupport:"Next action"};

/* ============ State ============ */
const S={db:null,user:null,downloads:null,assets:null,sample:null,offline:false,
  me:{uid:null,name:"",avatar:"",isOwner:false,canEdit:false,canWrite:null},
  roles:{},access:[],spaces:[],spaceId:null,space:null,
  tasks:[],updates:[],events:[],comments:[],requests:[],older:[],allTasks:{},
  names:{},avatars:{},loaded:{roles:false,spaces:false,tasks:false,updates:false},
  view:"spaces",unsub:[],allUnsub:[],
  filters:{q:"",dev:"",pri:"",status:"",health:"",eta:"",open:"open",rel:""},sort:{k:"health",d:1},
  hist:{dev:"",task:"",from:"",to:"",only:""},period:"7d",lastSeenPrev:null};

/* ============ Utils ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>isoOf(new Date());
const parseD=s=>{if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/86400000);
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return isoOf(d);};
const fmtD=s=>{const d=parseD(s);if(!d)return "—";return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"});};
const fmtTs=s=>{if(!s)return "";const d=new Date(s);if(isNaN(d))return "";return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})+", "+d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});};
const isWork=(d,ww)=>{const g=d.getDay();return ww>=6?g!==0:(g!==0&&g!==6);};
function workdaysBetween(a,b,ww){const A=parseD(a),B=parseD(b);if(!A||!B||B<=A)return 0;let n=0;const d=new Date(A);while(d<B){d.setDate(d.getDate()+1);if(isWork(d,ww))n++;}return n;}
function capacityTo(b,t,ww){const B=parseD(b),T=parseD(t);if(!B||!T||B<T)return 0;let n=0;const d=new Date(T);while(d<=B){if(isWork(d,ww))n++;d.setDate(d.getDate()+1);}return n;}
const num=v=>{if(v===""||v==null)return null;const n=Number(v);return Number.isFinite(n)?n:null;};
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const clone=o=>JSON.parse(JSON.stringify(o==null?{}:o));
const nowIso=()=>new Date().toISOString();
function toast(msg){const h=$("#toastHost");h.innerHTML='<div class="toast" role="status">'+esc(msg)+"</div>";clearTimeout(toast.t);toast.t=setTimeout(()=>{h.innerHTML="";},3600);}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
const short=(v,n)=>{v=Array.isArray(v)?v.join(", "):String(v==null?"":v);return v.length>n?v.slice(0,n-1)+"…":v;};

/* ============ People & roles ============ */
let OFF={};
const isOff=uid=>typeof uid==="string"&&uid.startsWith("x_");
const newOffId=()=>"x_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nm=uid=>!uid?"—":isOff(uid)?(OFF[uid]||"Former member"):(S.names[uid]||(uid===S.me.uid&&S.me.name)||"Unnamed person");
const offTag=uid=>isOff(uid)?' <span class="small muted">(no account)</span>':"";
const nms=arr=>(arr||[]).map(nm).join(", ");
function avatarImg(uid){if(isOff(uid))return '<span class="avatar off" aria-hidden="true">'+esc((OFF[uid]||"?").trim().charAt(0).toUpperCase())+"</span>";const u=S.avatars[uid];return u?'<img class="avatar" alt="" src="'+esc(u)+'">':'<span class="avatar"></span>';}
let namesBusy=false,namesAgain=false;
async function refreshNames(){
  if(!S.user)return;
  if(namesBusy){namesAgain=true;return;}
  namesBusy=true;
  const ids=new Set();
  Object.keys(S.roles).forEach(u=>ids.add(u));
  S.access.forEach(a=>ids.add(a.uid));
  S.spaces.forEach(sp=>{(sp.pms||[]).forEach(u=>ids.add(u));(sp.members||[]).forEach(m=>ids.add(m.uid));});
  S.requests.forEach(r=>ids.add(r.uid));
  S.tasks.forEach(t=>{(t.owners||[]).forEach(u=>ids.add(u));(t.reviewers||[]).forEach(u=>ids.add(u));});
  S.updates.forEach(u=>{if(u.dev)ids.add(u.dev);if(u.by)ids.add(u.by);});
  S.comments.forEach(c=>ids.add(c.by));S.events.forEach(e=>{if(e.by)ids.add(e.by);});
  if(S.me.uid)ids.add(S.me.uid);
  const list=[...ids].filter(x=>x&&!isOff(x));
  let changed=false;
  try{
    const ps=await S.user.profiles(list);
    for(const id of list){const p=ps[id];if(!p)continue;if(p.name&&S.names[id]!==p.name){S.names[id]=p.name;changed=true;}if(p.avatarUrl&&S.avatars[id]!==p.avatarUrl){S.avatars[id]=p.avatarUrl;changed=true;}}
  }catch(e){}
  namesBusy=false;
  if(namesAgain){namesAgain=false;refreshNames();}
  if(changed){renderChrome();rerender();}
}
function globalRole(){
  if(S.me.isOwner||S.me.canEdit)return "admin";
  if(S.me.canWrite===false)return "business";
  const r=S.roles[S.me.uid];
  if(r==="business")return "business";
  if(r==="pm")return "pm";
  return "member";
}
function spaceRoleOf(sp,uid){
  if(!sp)return "none";
  uid=uid||S.me.uid;
  if(uid===S.me.uid){const g=globalRole();if(g==="admin")return "pm";if(g==="business")return "viewer";}
  if((sp.pms||[]).includes(uid))return "pm";
  const m=(sp.members||[]).find(x=>x.uid===uid);
  return m?m.role:"none";
}
const spaceRole=()=>spaceRoleOf(S.space);
const isPM=()=>spaceRole()==="pm";

function evStats(id,T){
  const list=EV[id]||[];let rework=0,blockedDays=0,openFrom=null;const reworkDates=[];const intervals=[];
  for(const e of list){
    if(e.kind==="status"&&e.to==="Rework"&&e.from!=="Rework"){rework++;reworkDates.push(e.d);}
    if(e.kind==="blocker"){if(e.to==="on"&&!openFrom)openFrom=e.d;else if(e.to==="off"&&openFrom){intervals.push([openFrom,e.d]);openFrom=null;}}
  }

  intervals.forEach(([a,b])=>{blockedDays+=Math.max(0,diffDays(b||T,a));});
  return {rework,reworkDates,intervals,blockedDays};
}

/* ============ Derivation ============ */
function derive(t,T,ww,ev,taskMap){
  T=T||today();ww=ww||workWeek();
  const closed=CLOSED.has(t.status);
  const eta=t.currentEta||t.originalEta||"";
  const days=eta?diffDays(eta,T):null;
  const blocked=!closed&&(t.blocker==="Yes"||t.status==="Blocked");
  const overdue=!closed&&t.status!=="Backlog"&&days!=null&&days<0;
  const dueSoon=!closed&&t.status!=="Backlog"&&days!=null&&days>=0&&days<=1;
  let health;
  if(closed)health="Closed";else if(blocked)health="Blocked";else if(days==null)health="No ETA";else if(overdue)health="Overdue";else if(dueSoon)health="Due Soon";else health=t.status==="Backlog"&&days<0?"No ETA":"On Track";
  const active=!NOT_ACTIVE.has(t.status);
  const rem=num(t.remaining);
  const people=Math.max(1,(t.owners||[]).length);
  const cap=eta&&days!=null&&days>=0?capacityTo(eta,T,ww):0;
  const effortRisk=!closed&&!blocked&&rem!=null&&eta&&days!=null&&days>=0&&rem>cap*people;
  const etaChanged=!!(t.originalEta&&t.currentEta&&t.originalEta!==t.currentEta);
  const slip=t.originalEta&&eta?diffDays(closed&&t.actualDate?t.actualDate:eta,t.originalEta):null;
  const delay=overdue?-days:0;
  const doneDelay=t.status==="Done"&&t.actualDate&&t.originalEta?diffDays(t.actualDate,t.originalEta):null;
  const stale=active&&t.status!=="Ready"&&(!t.lastUpdated||workdaysBetween(t.lastUpdated,T,ww)>1);
  const st=ev||evStats(t.id,T);
  const tm=taskMap||{};
  const waitingOn=closed?[]:(t.dependsOn||[]).filter(id=>tm[id]&&!CLOSED.has(tm[id].status));
  return {closed,eta,days,blocked,overdue,dueSoon,health,active,rem,cap,people,effortRisk,etaChanged,slip,delay,doneDelay,stale,blockedDays:st.blockedDays,rework:st.rework,waitingOn};
}
/* status/blocker side effects -> {patch, events} */
function transition(prev,next,T){
  T=T||today();const patch={},events=[];
  if(next.status==="Blocked")patch.blocker=next.blocker="Yes";
  if(prev.status!==next.status){
    events.push({kind:"status",from:prev.status||"",to:next.status,d:T});
    if(next.status==="In Progress"&&!next.startDate&&!prev.startDate)patch.startDate=next.startDate=T;
  }
  const closed=CLOSED.has(next.status);
  if(closed){patch.blocker=next.blocker="No";if(next.status==="Done"){if(!next.actualDate&&!prev.actualDate)patch.actualDate=T;patch.qaConfirmed=true;patch.remaining=0;patch.pct=100;}}
  else if(CLOSED.has(prev.status)){patch.actualDate="";patch.qaConfirmed=false;}
  const wasBlocked=!CLOSED.has(prev.status)&&!!prev.status&&(prev.blocker==="Yes"||prev.status==="Blocked");
  const nowBlocked=!closed&&(next.blocker==="Yes"||next.status==="Blocked");
  if(nowBlocked&&!wasBlocked)events.push({kind:"blocker",to:"on",d:T});
  if(!nowBlocked&&wasBlocked)events.push({kind:"blocker",to:"off",d:T});
  return {patch,events};
}
function latestUpdate(id){let best=null;for(const u of S.updates){if(u.taskId!==id)continue;if(!best||(u.date+u.createdAt)>(best.date+best.createdAt))best=u;}return best;}

function needsReasons(t,d){

function computeKpis(rows,T){
  const k={active:0,inProgress:0,blocked:0,overdue:0,due24:0,review:0,done:0,doneWeek:0,noEta:0};
  const monday=addDays(T,-((parseD(T).getDay()+6)%7));
  rows.forEach(({t,d})=>{
    if(d.active)k.active++;if(t.status==="In Progress")k.inProgress++;if(d.blocked)k.blocked++;if(d.overdue)k.overdue++;if(d.dueSoon)k.due24++;
    if(t.status==="Code Review"||t.status==="QA")k.review++;
    if(t.status==="Done"){k.done++;if(t.actualDate&&t.actualDate>=monday&&t.actualDate<=T)k.doneWeek++;}
    if(d.active&&!d.eta)k.noEta++;
  });return k;
}
function sinceHtml(){
  const prev=S.lastSeenPrev;if(!prev)return "";
  const newBlk=S.events.filter(e=>e.kind==="blocker"&&e.to==="on"&&e.ts>prev&&e.by!==S.me.uid);
  const newEta=S.updates.filter(u=>u.etaChanged==="Yes"&&u.createdAt>prev&&u.by!==S.me.uid);
  const newCom=S.comments.filter(c=>c.ts>prev&&c.by!==S.me.uid);
  const newUpd=S.updates.filter(u=>u.createdAt>prev&&u.by!==S.me.uid);
  const parts=[];
  if(newBlk.length)parts.push(pill(plural(newBlk.length,"new blocker"),"red"));
  if(newEta.length)parts.push(pill(plural(newEta.length,"ETA change"),"amber"));
  if(newCom.length)parts.push(pill(plural(newCom.length,"new comment"),""));
  if(isPM()&&S.requests.length)parts.push('<a href="#settings" class="pill amber">'+plural(S.requests.length,"join request")+"</a>");
  if(!parts.length&&!newUpd.length)return '<div class="since small muted">Nothing new since your last visit ('+fmtTs(prev)+").</div>";
  return '<div class="since"><span class="small muted">Since your last visit ('+fmtTs(prev)+'):</span><span class="pill">'+plural(newUpd.length,"update")+"</span>"+parts.join("")+"</div>";
}

function complianceList(rows,T){
  const sp=S.space;

function filteredRows(){

    if(f.open==="open"&&d.closed)return false;if(f.open==="active"&&!d.active)return false;if(f.open==="mine"&&(!myTask(t)||d.closed))return false;
    if(f.dev&&!(t.owners||[]).includes(f.dev))return false;
    if(f.pri&&t.priority!==f.pri)return false;
    if(f.rel&&(t.release||"")!==(f.rel==="none"?"":f.rel))return false;
    if(f.status==="review"){if(t.status!=="Code Review"&&t.status!=="QA")return false;}else if(f.status&&t.status!==f.status)return false;
    if(f.health&&d.health!==f.health&&!(f.health==="Blocked"&&d.blocked))return false;

    if(f.eta==="7d"&&!(d.days!=null&&d.days>=0&&d.days<=7&&!d.closed))return false;
    if(f.eta==="none"&&!(d.active&&!d.eta))return false;
    if(q&&!(t.id+" "+t.name+" "+nms(t.owners)+" "+nms(t.reviewers)+" "+(t.scope||"")+" "+relName(t.release)).toLowerCase().includes(q))return false;
    return true;});
  const keyf={health:x=>HEALTH.indexOf(x.d.health)*1000+(x.d.days??999),id:x=>x.t.id,name:x=>x.t.name.toLowerCase(),pri:x=>PRIORITIES.indexOf(x.t.priority),owner:x=>nm((x.t.owners||[])[0]).toLowerCase(),status:x=>STATUSES.indexOf(x.t.status),eta:x=>x.d.eta||"9999",days:x=>x.d.days??99999,rem:x=>x.d.rem??-1,upd:x=>x.t.lastUpdated||""}[S.sort.k];

async function prdView(i){

async function prdDownload(i){const f=DLG.files[i];if(!f||!S.downloads)return;try{const r=await fetch("/_blob/"+f.id);if(!r.ok)throw 0;await S.downloads.save({filename:f.name,data:await r.blob()});}catch(e){if(!(e&&e.code==="declined"))toast("Couldn’t download "+f.name+".");}}

async function prdSourceText(){
  const pasted=($("#prdPaste")&&$("#prdPaste").value.trim())||"";
  if(pasted)return {text:pasted,from:"pasted PRD text"};
  if(!DLG.files.length)return {text:"",from:""};
  let text="";const names=[];
  for(const f of DLG.files){const r=await fetch("/_blob/"+f.id);if(!r.ok)throw new Error("fetch");
    text+="\n\n# "+f.name+"\n"+(f.type==="application/pdf"?await pdfText(await r.arrayBuffer()):await r.text());names.push(f.name);if(text.length>90000)break;}
  return {text:text.slice(0,90000),from:names.join(", ")};
}
function aiStatus(msg){const el=$("#aiStatus");if(el)el.textContent=msg;}
function autoFill(){if(!S.sample||DLG.aiBusy||DLG.mode!=="pm")return;const sc=$("#tf_scope"),ac=$("#tf_acceptance");if(!sc||!ac)return;if(sc.value.trim()||ac.value.trim()){aiStatus("Scope or criteria already has text. Use the button to replace it with an AI draft.");return;}aiFill(true);}
async function aiFill(auto){
  if(DLG.aiBusy)return;if(!S.sample){aiStatus("AI drafting isn’t available in this view.");return;}
  const sc=$("#tf_scope"),ac=$("#tf_acceptance"),nmI=$("#tf_name");
  if(!auto&&(sc.value.trim()||ac.value.trim())&&!await ask("Replace the current scope and acceptance criteria with an AI draft? You can still edit it before saving."))return;
  const btn=$("#aiBtn");DLG.aiBusy=true;if(btn)btn.disabled=true;
  try{
    aiStatus("Reading the PRD…");let src;
    try{src=await prdSourceText();}catch(e){aiStatus("Couldn’t read the PRD file. Paste its text instead.");return;}
    if(!src.text.trim()){aiStatus($("#tf_prdLink")&&$("#tf_prdLink").value?"AI can’t open links from this page. Upload the PRD or paste its text.":"Add a PRD file or paste its text first.");return;}
    if(src.text.replace(/\s+/g,"").length<150){aiStatus("Almost no text found. A scanned PDF can’t be read; paste the text instead.");return;}
    aiStatus("Drafting with AI…");
    const name=(nmI&&nmI.value.trim())||"";const type=($("#tf_type")&&$("#tf_type").value)||"";
    const prompt="You are helping a product manager fill in one development task from a PRD.\nTask name: "+(name?JSON.stringify(name):"(not named yet)")+"\nTask type: "+type+"\n\nFrom the PRD below, extract only what applies to this task. If the PRD covers several features, use the part that matches the task name; with no task name, use the PRD's main feature.\nReturn JSON only, with exactly these keys: {\"taskName\": string, \"scope\": string, \"acceptance\": string, \"gaps\": string}\n- scope: requirements and scope as plain-text lines, each starting with \"- \". List what is in scope first. If the PRD states exclusions, add a line \"Out of scope:\" followed by those items. At most 14 lines.\n- acceptance: testable acceptance criteria as plain-text lines, each starting with \"- \", each one something QA can verify as pass or fail. At most 14 lines.\n- taskName: a short feature name from the PRD, at most 8 words.\n- gaps: one sentence naming anything the PM must clarify (missing criteria, conflicting statements, undefined numbers), or an empty string.\nRules: use only information stated in the PRD. Do not invent numbers, dates, screens or behaviours. If the PRD has no explicit acceptance criteria, derive them strictly from its stated requirements. No Markdown formatting other than the leading \"- \".\n\nPRD (from "+src.from+"):\n<<<\n"+src.text+"\n>>>";
    const out=await S.sample.json(prompt,{modelTier:"default"});
    if(!out||typeof out!=="object"||(!out.scope&&!out.acceptance)){aiStatus("The AI returned nothing usable. Try again or fill the fields by hand.");return;}
    if(out.scope){sc.value=String(out.scope).trim();sc.classList.add("ai-new");}
    if(out.acceptance){ac.value=String(out.acceptance).trim();ac.classList.add("ai-new");}
    if(nmI&&!nmI.value.trim()&&out.taskName)nmI.value=String(out.taskName).trim().slice(0,160);
    DLG.aiFrom=src.from;const sh=$("#scopeHint");if(sh)sh.textContent="AI draft from "+src.from+". Review and edit before saving.";
    aiStatus((out.gaps?"To clarify: "+String(out.gaps).trim()+" ":"")+"Draft added below. Edit anything before saving.");
  }catch(e){const c=e&&e.code;
    aiStatus(c==="prompt_too_large"?"The PRD is too long. Paste only the section for this task.":c==="rate_limited"?"AI is busy or your usage limit is reached. Try again in a few minutes.":["not_granted","sampling_disabled","not_declared"].includes(c)?"AI drafting isn’t allowed for you here. Fill the fields by hand.":c==="invalid_json"?"The AI reply couldn’t be read. Try again.":c==="session_expired"?"Your session expired. Reload the page.":"AI drafting failed. Try again or fill the fields by hand.");
  }finally{DLG.aiBusy=false;if(btn)btn.disabled=false;}
}

async function submitUpdate(e){
  e.preventDefault();if(!guardWrite())return;
  const form=$("#upForm");clearErr(form);
  const fd=new FormData(form);const g=k=>(fd.get(k)??"").toString().trim();
  const t=S.tasks.find(x=>x.id===g("taskId"));const pm=isPM();
  const dev=g("dev")||S.me.uid;
  const u={date:g("date"),taskId:g("taskId"),dev,status:g("status"),done:g("done"),next:g("next"),pending:g("pending"),blocker:g("blocker")||"No",blockerDetails:g("blockerDetails"),blockerOwner:g("blockerOwner"),pmSupport:g("pmSupport"),prevEta:$("#tf_prevEta").value,newEta:g("newEta"),etaReason:g("etaReason"),remaining:g("remaining")===""?"":Number(g("remaining")),pr:g("pr"),confidence:g("confidence")};
  if(u.status==="Blocked")u.blocker="Yes";
  let bad=false;const err=(k,m)=>{setErr(form,k,m);bad=true;};
  if(!dev)err("dev","Choose who this update is for.");
  if(!u.date||u.date>today())err("date","Use today or an earlier date.");
  if(!t)err("taskId","Choose a task.");
  else if(!pm&&dev===S.me.uid&&!myTask(t))err("taskId","You can only log updates on tasks assigned to you.");
  else if(!pm&&dev!==S.me.uid&&!(isOff(dev)&&(t.owners||[]).includes(S.me.uid)&&[...(t.owners||[]),...(t.reviewers||[])].includes(dev)))err("dev","You can log only for teammates without an account on your own tasks.");
  if(!u.done)err("done","Say what you completed today. “No progress” is a valid answer.");
  if(!u.confidence)err("confidence","Pick a confidence level.");
  if(u.remaining===""||u.remaining<0)err("remaining","Enter remaining effort in days. Use 0 if finished.");
  if(u.blocker==="Yes"&&!u.blockerDetails)err("blockerDetails","Describe what is blocking you.");
  const changed=!!(u.newEta&&u.newEta!==u.prevEta);
  if(changed&&!u.etaReason)err("etaReason","Give the reason the ETA is moving.");
  if(changed&&u.newEta<u.date)err("newEta","A revised ETA can’t be before the update date.");
  if(u.status==="Done"&&!$("#up_qa").checked)err("status","Confirm acceptance criteria and QA below before marking Done.");

  u.etaChanged=changed?"Yes":"No";if(!changed){u.newEta="";u.etaReason="";}
  u.taskName=t.name;u.source=dev===S.me.uid?"dev":isOff(dev)?"proxy":"pm";u.by=S.me.uid||null;u.createdAt=nowIso();
  const prev=clone(t);
  const next={...prev,status:u.status,blocker:u.blocker,remaining:u.remaining};
  const tr=transition(prev,next,u.date);
  const patch={status:u.status,latestUpdate:u.done,todayPlan:u.next,blocker:next.blocker,remaining:u.remaining,lastUpdated:u.date>(prev.lastUpdated||"")?u.date:prev.lastUpdated,...tr.patch};
  if(u.blocker==="Yes"){patch.blockerDetails=u.blockerDetails;patch.blockerOwner=u.blockerOwner;}
  else if(prev.blocker==="Yes"){patch.blockerDetails="";patch.blockerOwner="";}
  if(u.pmSupport)patch.pmSupport=u.pmSupport;else if(prev.pmSupport&&u.blocker==="No")patch.pmSupport="";
  if(changed)patch.currentEta=u.newEta;
  if(u.pr)patch.pr=u.pr;
  const btn=form.querySelector("button[type=submit]");btn.disabled=true;
  const ok=await write(async()=>{await S.db.collection(P("updates")).add(u);await S.db.doc(P("tasks")+"/"+t.id).update(patch);await logEvents(t.id,tr.events);});
  btn.disabled=false;
  if(ok){toast("Update logged for "+t.id);renderUpdate();if($("#tf_dev").tagName==="SELECT"){$("#tf_dev").value=dev;refreshUpdateOptions(true);}$("#tf_taskId").focus();}
}

/* ============ History ============ */
function allUpdates(){const seen=new Set();return [...S.updates,...S.older].filter(u=>{const k=u._id||u.createdAt+u.taskId;if(seen.has(k))return false;seen.add(k);return true;});}

  [["hdev","dev"],["htask","task"],["hfrom","from"],["hto","to"],["honly","only"]].forEach(([id,k])=>$("#"+id).addEventListener("change",e=>{S.hist[k]=e.target.value;renderHistory();}));

/* ============ Reports ============ */
function periodRange(p,T){if(p==="week")return [addDays(T,-((parseD(T).getDay()+6)%7)),T];if(p==="7d")return [addDays(T,-6),T];if(p==="30d")return [addDays(T,-29),T];if(p==="month")return [T.slice(0,8)+"01",T];return ["0000-01-01",T];}
function reportData(){
  const T=today();const [from,to]=periodRange(S.period,T);const inP=s=>s&&s>=from&&s<=to;
  const rows=rowsAll(T);
  const done=rows.filter(x=>x.t.status==="Done"&&inP(x.t.actualDate));
  const withO=done.filter(x=>x.t.originalEta);const onTime=withO.filter(x=>x.d.doneDelay<=0);const late=withO.filter(x=>x.d.doneDelay>0);
  const avgDelay=late.length?late.reduce((s,x)=>s+x.d.doneDelay,0)/late.length:0;
  const ups=allUpdates().filter(u=>inP(u.date));const etaRev=ups.filter(u=>u.etaChanged==="Yes");
  const rework=[];rows.forEach(x=>evStats(x.t.id,T).reworkDates.forEach(d=>{if(inP(d))rework.push(x);}));
  const blockedIn=x=>{let n=0;evStats(x.t.id,T).intervals.forEach(([a,b])=>{const s=a>from?a:from;const e=(b||T)<to?(b||T):to;if(e>s)n+=diffDays(e,s);});return n;};
  const totalBlocked=rows.reduce((s,x)=>s+blockedIn(x),0);
  const bo={};ups.filter(u=>u.blocker==="Yes").forEach(u=>{const k=(u.blockerOwner||"Unspecified").trim();(bo[k]=bo[k]||new Set()).add(u.taskId);});
  const boArr=Object.entries(bo).map(([k,v])=>[k,v.size]).sort((a,b)=>b[1]-a[1]);
  const byType={};rework.forEach(x=>{byType[x.t.type||"Other"]=(byType[x.t.type||"Other"]||0)+1;});
  const devs=[...new Set([...spaceDevs(S.space),...rows.flatMap(x=>x.t.owners||[])])];
  const devRows=devs.map(dv=>{const mine=rows.filter(x=>(x.t.owners||[]).includes(dv));const act=mine.filter(x=>x.d.active);const dn=done.filter(x=>(x.t.owners||[]).includes(dv)&&x.t.originalEta);const ot=dn.filter(x=>x.d.doneDelay<=0).length;const sl=dn.map(x=>x.d.doneDelay);
    const myUps=ups.filter(u=>u.dev===dv&&!u.auto);
    return {dv,active:act.length,rem:Math.round(act.reduce((s,x)=>s+(x.d.rem||0)/x.d.people,0)*10)/10,overdue:act.filter(x=>x.d.overdue).length,done:done.filter(x=>(x.t.owners||[]).includes(dv)).length,ontime:dn.length?Math.round(ot/dn.length*100)+"%":"—",slip:sl.length?(sl.reduce((a,b)=>a+b,0)/sl.length).toFixed(1)+"d":"—",rev:etaRev.filter(u=>{const tt=S.tasks.find(z=>z.id===u.taskId);return tt&&(tt.owners||[]).includes(dv);}).length,rework:rework.filter(x=>(x.t.owners||[]).includes(dv)).length,blocked:mine.reduce((s,x)=>s+blockedIn(x),0),updDays:new Set(myUps.map(u=>u.date)).size};});
  const rel=releases().map(r=>{const ts=rows.filter(x=>x.t.release===r.id);const open=ts.filter(x=>!x.d.closed);const latest=open.map(x=>x.d.eta).filter(Boolean).sort().pop()||"";
    let status="No tasks";if(ts.length){if(!open.length)status="Complete";else if(r.date&&r.date<T)status="Late";else if(open.some(x=>x.d.overdue||x.d.blocked||(r.date&&x.d.eta&&x.d.eta>r.date)||!x.d.eta))status="At risk";else status="On track";}
    return {r,total:ts.length,done:ts.filter(x=>x.t.status==="Done").length,open:open.length,overdue:open.filter(x=>x.d.overdue).length,blocked:open.filter(x=>x.d.blocked).length,latest,status};});
  return {T,from,to,rows,done,withO,onTime,late,avgDelay,etaRev,rework,totalBlocked,boArr,byType,devRows,rel};
}
function renderReports(){
  const R=reportData();
  const N=(l,v,cls)=>'<div class="num '+(cls||"")+'" style="cursor:default"><span class="num-l">'+l+'</span><span class="num-v">'+v+"</span></div>";
  const relCls={"Late":"red","At risk":"amber","On track":"green","Complete":"green","No tasks":""};
  const lateRows=R.late.sort((a,b)=>b.d.doneDelay-a.d.doneDelay).map(x=>'<tr class="click" data-task="'+esc(x.t.id)+'"><td class="id">'+esc(x.t.id)+"</td><td>"+esc(x.t.name)+"</td><td>"+esc(nms(x.t.owners)||"—")+"</td><td>"+fmtD(x.t.originalEta)+"</td><td>"+fmtD(x.t.actualDate)+'</td><td class="n">+'+x.d.doneDelay+'d</td><td class="n">'+etaRevisions(x.t.id)+"</td></tr>").join("");

  '<div class="numbers" style="max-width:820px">'+N("Completed in period",R.done.length,"green")+N("On time against Original ETA",R.withO.length?Math.round(R.onTime.length/R.withO.length*100)+"%":"—")+N("Completed late",R.late.length,R.late.length?"amber":"")+N("Average delay of late tasks",R.late.length?R.avgDelay.toFixed(1)+"d":"—")+N("ETA revisions logged",R.etaRev.length,R.etaRev.length?"amber":"")+N("Rework cycles started",R.rework.length,R.rework.length?"amber":"")+N("Overdue right now",R.rows.filter(x=>x.d.overdue).length,"red")+N("Developer-days blocked",R.totalBlocked,R.totalBlocked?"red":"")+"</div>"+
  (R.rel.length?'<section class="section"><div class="section-h"><h2>Releases</h2><span class="count">Risk from open tasks against each target date</span></div><div class="tw"><table><thead><tr><th>Release</th><th>Target</th><th>Status</th><th class="n">Tasks</th><th class="n">Done</th><th class="n">Open</th><th class="n">Overdue</th><th class="n">Blocked</th><th>Latest open ETA</th></tr></thead><tbody>'+R.rel.map(x=>'<tr class="click" data-filter=\''+esc(JSON.stringify({rel:x.r.id,open:"all"}))+'\'><td><b>'+esc(x.r.name)+"</b></td><td>"+fmtD(x.r.date)+"</td><td>"+pill(x.status,relCls[x.status])+'</td><td class="n">'+x.total+'</td><td class="n">'+x.done+'</td><td class="n">'+x.open+'</td><td class="n">'+x.overdue+'</td><td class="n">'+x.blocked+"</td><td>"+fmtD(x.latest)+(x.r.date&&x.latest&&x.latest>x.r.date?" "+pill("after target","amber"):"")+"</td></tr>").join("")+"</tbody></table></div></section>":"")+
  '<section class="section"><div class="section-h"><h2>By developer</h2><span class="count">Context, not a score</span></div><div class="tw"><table><thead><tr><th>Developer</th><th class="n">Active</th><th class="n">Effort share</th><th class="n">Overdue</th><th class="n">Completed</th><th class="n">On time</th><th class="n">Avg slip</th><th class="n">ETA revisions</th><th class="n">Rework</th><th class="n">Days blocked</th><th class="n">Days with updates</th></tr></thead><tbody>'+(R.devRows.map(r=>"<tr><td>"+esc(nm(r.dv))+'</td><td class="n">'+r.active+'</td><td class="n">'+r.rem+'d</td><td class="n">'+r.overdue+'</td><td class="n">'+r.done+'</td><td class="n">'+r.ontime+'</td><td class="n">'+r.slip+'</td><td class="n">'+r.rev+'</td><td class="n">'+r.rework+'</td><td class="n">'+r.blocked+'</td><td class="n">'+r.updDays+"</td></tr>").join("")||'<tr><td colspan="11" class="muted">No developers yet.</td></tr>')+'</tbody></table></div><p class="small muted">Read alongside task type, priority and dependencies. Blocked days and rework often come from outside the developer. Shared tasks count once per developer, with effort split evenly. Completed counts alone are not a performance measure.</p></section>'+
  '<div class="cols2"><section class="section"><div class="section-h"><h2>Recurring blocker owners</h2><span class="count">Tasks blocked in period</span></div>'+(barsOf(R.boArr)||'<div class="empty">No blockers logged in this period.</div>')+'</section><section class="section"><div class="section-h"><h2>Rework by task type</h2></div>'+(barsOf(Object.entries(R.byType).sort((a,b)=>b[1]-a[1]))||'<div class="empty">No rework in this period.</div>')+"</section></div>"+
  '<section class="section"><div class="section-h"><h2>Completed late</h2><span class="count">Original ETA against actual completion</span></div>'+(lateRows?'<div class="tw"><table><thead><tr><th>ID</th><th>Task</th><th>Developers</th><th>Original ETA</th><th>Completed</th><th class="n">Delay</th><th class="n">ETA revisions</th></tr></thead><tbody>'+lateRows+"</tbody></table></div>":'<div class="empty">No late completions in this period.</div>')+"</section>";
  $("#period").addEventListener("change",e=>{S.period=e.target.value;renderReports();});

/* ============ Validation checklist ============ */
function runChecks(){
  const T="2026-01-14";const c=[];const ok=(label,cond,detail)=>c.push({label,ok:!!cond,detail});
  const Z={blockedDays:0,rework:0};const D=(t,tm)=>derive(t,T,5,Z,tm||{});
  ok("Done task past its ETA is Closed, not overdue",(()=>{const d=D({status:"Done",originalEta:"2026-01-10",currentEta:"2026-01-10"});return d.health==="Closed"&&!d.overdue;})());
  ok("Dropped task with a blocker is not counted as blocked",(()=>{const d=D({status:"Dropped",blocker:"Yes",currentEta:"2026-01-01"});return !d.blocked&&!d.overdue;})());
  ok("Backlog task with a past ETA is not overdue",!D({status:"Backlog",currentEta:"2026-01-01"}).overdue);
  ok("Open task with ETA yesterday is Overdue by 1 day",(()=>{const d=D({status:"In Progress",currentEta:"2026-01-13"});return d.health==="Overdue"&&d.delay===1;})());
  ok("ETA today and tomorrow are Due Soon; in two days is On Track",D({status:"QA",currentEta:"2026-01-14"}).health==="Due Soon"&&D({status:"QA",currentEta:"2026-01-15"}).health==="Due Soon"&&D({status:"QA",currentEta:"2026-01-16"}).health==="On Track");
  ok("Status Blocked counts as blocked",D({status:"Blocked",currentEta:"2026-02-01"}).blocked);
  ok("Two developers double the capacity for the effort-risk check",D({status:"In Progress",currentEta:"2026-01-16",remaining:5,owners:["a","b"]}).effortRisk===false&&D({status:"In Progress",currentEta:"2026-01-16",remaining:7,owners:["a","b"]}).effortRisk===true);
  ok("Open dependency shows Waiting on; a Done one clears it",D({status:"In Progress",dependsOn:["T-2"]},{"T-2":{status:"QA"}}).waitingOn.length===1&&D({status:"In Progress",dependsOn:["T-2"]},{"T-2":{status:"Done"}}).waitingOn.length===0);
  ok("Status change logs an event and keeps the Original ETA",(()=>{const p={status:"In Progress",originalEta:"2026-01-10"};const n={...p,status:"QA"};const r=transition(p,n,T);return r.events.some(e=>e.kind==="status"&&e.to==="QA")&&!("originalEta" in r.patch);})());
  ok("Blocker on and off are logged as separate events",(()=>{const a=transition({status:"In Progress",blocker:"No"},{status:"In Progress",blocker:"Yes"},T);const b=transition({status:"In Progress",blocker:"Yes"},{status:"In Progress",blocker:"No"},T);return a.events[0].to==="on"&&b.events[0].to==="off";})());
  ok("Marking Done stamps the date, clears blocker and sets effort to 0",(()=>{const r=transition({status:"QA",blocker:"Yes"},{status:"Done",blocker:"Yes"},T);return r.patch.actualDate===T&&r.patch.blocker==="No"&&r.patch.remaining===0&&r.events.some(e=>e.to==="off");})());
  ok("Reopening a Done task clears completion date and QA confirmation",(()=>{const r=transition({status:"Done",actualDate:T,qaConfirmed:true},{status:"QA"},T);return r.patch.actualDate===""&&r.patch.qaConfirmed===false;})());
  const vt=validTasks();const ids=new Set(S.tasks.map(t=>t.id));
  const orphan=S.updates.filter(u=>!ids.has(u.taskId));
  ok("Every update links to an existing task",!orphan.length,orphan.length?orphan.length+" updates point at missing tasks":"");
  const noReason=vt.filter(t=>t.originalEta&&t.currentEta&&t.originalEta!==t.currentEta&&!S.updates.some(u=>u.taskId===t.id&&u.etaChanged==="Yes"));
  ok("Every moved ETA has a logged reason",!noReason.length,noReason.length?"Missing for "+noReason.map(t=>t.id).join(", "):"");
  const doneNoDate=vt.filter(t=>t.status==="Done"&&!t.actualDate);ok("Every Done task has a completion date",!doneNoDate.length,doneNoDate.length?"Missing for "+doneNoDate.map(t=>t.id).join(", "):"");
  const blkNo=vt.filter(t=>!CLOSED.has(t.status)&&(t.blocker==="Yes"||t.status==="Blocked")&&!t.blockerDetails);ok("Every blocked task has blocker details",!blkNo.length,blkNo.length?"Missing for "+blkNo.map(t=>t.id).join(", "):"");
  const members=new Set([...(S.space?.pms||[]),...(S.space?.members||[]).map(m=>m.uid)]);
  const strays=vt.filter(t=>!CLOSED.has(t.status)&&[...(t.owners||[]),...(t.reviewers||[])].some(u=>!members.has(u)));
  ok("Open tasks are assigned only to current space members",!strays.length,strays.length?"Check "+strays.map(t=>t.id).join(", "):"");
  return c;
}

      case "addType":{const i=$("#addType");const v=i.value.trim();if(!v)break;if(spaceTypes().some(x=>x.toLowerCase()===v.toLowerCase())){toast(v+" already exists.");break;}await spaceUpdate({types:[...spaceTypes(),v]});i.value="";break;}
      case "rmType":{if(spaceTypes().length<=1){toast("Keep at least one task type.");break;}const i=Number(a.dataset.i);await spaceUpdate({types:spaceTypes().filter((_,j)=>j!==i)},"Removed. Existing tasks keep their type.");break;}
      case "addRelease":{const n=$("#relName").value.trim();const d=$("#relDate").value;if(!n){toast("Enter a release name.");break;}if(releases().some(r=>r.name.toLowerCase()===n.toLowerCase())){toast("That release exists.");break;}await spaceUpdate({releases:[...releases(),{id:"r"+Date.now().toString(36),name:n,date:d}]},"Release added");break;}
      case "rmRelease":{const id=a.dataset.id;const used=validTasks().filter(t=>t.release===id).length;if(used&&!await ask(plural(used,"task")+" use this release. Remove it anyway? They’ll show no release."))break;await spaceUpdate({releases:releases().filter(r=>r.id!==id)},"Release removed");break;}
      case "deleteSpace":{if(validTasks().length){await tell("This space still has "+plural(validTasks().length,"task")+". Drop or delete them first.");break;}if(!await ask("Delete the space "+S.space.name+"?"))break;const sid=S.spaceId;const ok=await write(()=>S.db.doc("spaces/"+sid).delete());if(ok){selectSpace(null);location.hash="spaces";toast("Space deleted");}break;}
      case "linkOff":linkDialog(uid);break;
      case "aiFill":aiFill(false);break;
      case "prdView":prdView(Number(a.dataset.i));break;case "prdDownload":prdDownload(Number(a.dataset.i));break;case "prdRemove":prdRemove(Number(a.dataset.i));break;
    }
    return;}
  const sp=e.target.closest("[data-space]");if(sp){selectSpace(sp.dataset.space);return;}
  const hb=e.target.closest("[data-hist]");if(hb){S.hist={dev:"",task:"",from:"",to:"",only:"",...JSON.parse(hb.dataset.hist)};location.hash="history";return;}
  const f=e.target.closest("[data-filter]");if(f){S.filters={q:"",dev:"",pri:"",status:"",health:"",eta:"",open:"open",rel:"",...JSON.parse(f.dataset.filter)};location.hash="tasks";if(S.view==="tasks")renderTasks();return;}
  const s=e.target.closest("th[data-sort]");if(s){const k=s.dataset.sort;S.sort=S.sort.k===k?{k,d:-S.sort.d}:{k,d:1};renderTasks();return;}
  const r=e.target.closest("[data-task]");if(r&&!e.target.closest("a")){const id=r.dataset.task;if(S.tasks.some(t=>t.id===id))openTask(id);else toast(id+" no longer exists.");}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.closest&&e.target.closest("li[data-task],.slip[data-task]");if(r)openTask(r.dataset.task);}});
$("#taskForm").addEventListener("submit",submitTask);
$("#taskDlg").addEventListener("close",()=>{if(!DLG.saved&&S.assets&&DLG.newUploads.length)DLG.newUploads.forEach(id=>{S.assets.delete(id).catch(()=>{});});DLG.newUploads=[];rerender(true);});
$("#taskDlg").addEventListener("click",e=>{if(e.target.id==="taskDlg")$("#taskDlg").close();});
$("#miniDlg").addEventListener("click",e=>{if(e.target.id==="miniDlg")closeMini();});
$("#miniDlg").addEventListener("close",()=>rerender(true));
init();
</script>
</body>
</html>
